<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error (500) - PHF System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">PHF | Eurogentec</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 card shadow-sm p-5 bg-white border-0 text-center">
            <h1 class="display-1 text-danger fw-bold"><i class="bi bi-shield-slash-fill"></i> 500</h1>
            <h3 class="text-dark my-3">Internal Server Error</h3>
            <p class="text-muted">
                The system encountered an unexpected technical issue on the server.
                The system administrators have been automatically notified.
            </p>
            <p class="text-muted small">Please try again in a few moments or contact the PHF support team if the problem persists.</p>
            <a href="/" class="btn btn-danger mt-3">
                <i class="bi bi-arrow-clockwise"></i> Reload Application
            </a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
