{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Login | PHF System{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow border-0">
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="mb-0">Access Control</h4>
            </div>
            <div class="card-body p-4">
                <p class="text-muted text-center small mb-4">Please sign in to access the PHF Database.</p>

                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary shadow-sm">
                            Sign In
                        </button>
                    </div>
                </form>
            </div>
            <div class="card-footer bg-light text-center py-2">
                <small class="text-muted">Eurogentec PHF System &copy; {% now "Y" %}</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
