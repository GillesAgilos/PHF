{% extends "base.html" %}

{% block title %}Bad Request (400) - PHF System{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <h1 class="display-1 text-muted fw-bold"><i class="bi bi-bug-fill text-secondary"></i> 400</h1>
        <h3 class="text-dark my-3">Bad Request</h3>
        <p class="text-muted">
            The server could not understand the request due to invalid syntax or corrupted data sent by the browser.
        </p>
        <a href="{% url 'home' %}" class="btn btn-primary mt-3">
            <i class="bi bi-house-door-fill"></i> Back to Home
        </a>
    </div>
</div>
{% endblock %}
